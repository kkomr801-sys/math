let voiceScore = 0, voiceTotal = 0;
let currentVoiceQ = null;

function generateVoiceQ() {
  const modeKey = document.getElementById('voiceModeSelect')?.value || 'add';
  const gen = QUIZ_GENS[modeKey] || QUIZ_GENS.add10;
  currentVoiceQ = gen();
  const display = document.getElementById('voiceQDisplay');
  if (display) display.textContent = currentVoiceQ.q;
}

function speakCurrentQ() {
  if (!currentVoiceQ) return;
  speak(currentVoiceQ.q.replace('?','').replace('=','等於').replace('+','加').replace('−','減').replace('×','乘以').replace('÷','除以'));
}

function speak(text, onEnd) {
  if (!('speechSynthesis' in window)) return;
  stopSpeech();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'zh-TW';
  utter.rate = ttsRate;
  utter.pitch = 1.1;
  utter.volume = 1;
  // Try to find a Chinese voice
  const voices = speechSynth.getVoices();
  const zhVoice = voices.find(v => v.lang.startsWith('zh'));
  if (zhVoice) utter.voice = zhVoice;
  if (onEnd) utter.onend = onEnd;
  speechSynth.speak(utter);
  isSpeaking = true;
}

function stopSpeech() {
  if ('speechSynthesis' in window) speechSynth.cancel();
  isSpeaking = false;
}

function setTTSRate(rate, btn) {
  ttsRate = rate;
  document.querySelectorAll('.tts-speed-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function startVoiceMode() {
  const modeKey = document.getElementById('voiceModeSelect')?.value || 'add';
  const gen = QUIZ_GENS[modeKey] || QUIZ_GENS.add10;
  currentVoiceQ = gen();
  const qEl = document.getElementById('voiceAnsQ');
  if (qEl) qEl.textContent = currentVoiceQ.q;
  const qText = currentVoiceQ.q.replace('?','？').replace('=','等於').replace('+','加').replace('−','減').replace('×','乘以').replace('÷','除以');
  speak('請回答這道題：' + qText, () => {
    document.getElementById('voiceStatus').textContent = '請說出你的答案...';
    setTimeout(() => startListening(), 400);
  });
}

function skipVoiceQ() {
  stopSpeech();
  stopListening();
  startVoiceMode();
}

function toggleListening() {
  if (isListening) stopListening();
  else startListening();
}

function startListening() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    document.getElementById('voiceStatus').textContent = '此瀏覽器不支援語音辨識，請改用 Chrome';
    return;
  }
  recognition = new SpeechRecognition();
  recognition.lang = 'zh-TW';
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.maxAlternatives = 3;

  recognition.onstart = () => {
    isListening = true;
    document.getElementById('micBtn').classList.add('listening');
    document.getElementById('micBtn').textContent = '🔴';
    document.getElementById('voiceStatus').textContent = '🎤 聆聽中...請說出答案！';
    document.getElementById('waveformWrap').classList.remove('hidden');
  };

  recognition.onresult = (e) => {
    const transcript = Array.from(e.results).map(r => r[0].transcript).join('').trim();
    document.getElementById('voiceTranscript').textContent = transcript;
    if (e.results[e.results.length-1].isFinal) {
      processVoiceAnswer(transcript);
    }
  };

  recognition.onerror = (e) => {
    stopListening();
    document.getElementById('voiceStatus').textContent = '辨識失敗，請再試一次 (' + e.error + ')';
  };

  recognition.onend = () => { if (isListening) stopListening(); };
  recognition.start();
}

function stopListening() {
  isListening = false;
  if (recognition) { try { recognition.stop(); } catch(e){} recognition = null; }
  const micBtn = document.getElementById('micBtn');
  if (micBtn) { micBtn.classList.remove('listening'); micBtn.textContent = '🎤'; }
  const wf = document.getElementById('waveformWrap');
  if (wf) wf.classList.add('hidden');
  const status = document.getElementById('voiceStatus');
  if (status) status.textContent = '點擊麥克風重新答題';
}

function processVoiceAnswer(transcript) {
  stopListening();
  if (!currentVoiceQ) return;
  const correct = String(currentVoiceQ.ans);
  // Normalize: remove spaces, convert Chinese numbers
  const normalize = s => s.replace(/\s/g,'').replace(/零/g,'0').replace(/一/g,'1').replace(/二/g,'2').replace(/三/g,'3').replace(/四/g,'4').replace(/五/g,'5').replace(/六/g,'6').replace(/七/g,'7').replace(/八/g,'8').replace(/九/g,'9').replace(/十/g,'10');
  const norm = normalize(transcript);
  const isCorrect = norm.includes(normalize(correct)) || norm === normalize(correct);

  voiceTotal++;
  const fb = document.getElementById('voiceFeedback');
  const scoreEl = document.getElementById('voiceScore');
  const totalEl = document.getElementById('voiceTotal');

  if (isCorrect) {
    voiceScore++;
    if (fb) fb.innerHTML = `<span class="feedback-good">🎉 答對了！正確答案是 ${correct}！</span>`;
    speak('答對了！太棒了！');
    awardStar();
  } else {
    if (fb) fb.innerHTML = `<span class="feedback-bad">😅 答案是 ${correct}，你說了「${transcript}」</span>`;
    speak('再想想，答案是' + correct);
  }
  if (scoreEl) scoreEl.textContent = '語音答對：' + voiceScore + ' 題';
  if (totalEl) totalEl.textContent = '共答：' + voiceTotal + ' 題';
  logActivity('語音答題', isCorrect?1:0, 1, 0);

  // Auto next after 2.5s
  clearTimeout(voiceAnswerTimeout);
  voiceAnswerTimeout = setTimeout(() => {
    if (document.getElementById('voiceAnsQ')) startVoiceMode();
  }, 2500);
}
